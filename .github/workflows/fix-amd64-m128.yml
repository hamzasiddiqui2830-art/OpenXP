name: Fix AMD64 M128 compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix AMD64 M128 compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace invalid M128 members
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ntoskrnl/inc/amd64.h')
          s = p.read_text()
          pattern = r'(?m)^    M128 Xmm(?:[0-9]|1[0-5]);$'
          matches = re.findall(pattern, s)
          if len(matches) != 16:
              raise SystemExit(f'Expected exactly 16 M128 Xmm members, found {len(matches)}')
          s2 = re.sub(pattern, lambda m: m.group(0).replace('M128 ', 'M128A '), s)
          if re.search(pattern, s2):
              raise SystemExit('Unpatched M128 Xmm member remains')
          if s2.count('    M128A Xmm') != 16:
              raise SystemExit('Expected exactly 16 M128A Xmm members after patch')
          p.write_text(s2)
          PY
      - name: Verify exact diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "ntoskrnl/inc/amd64.h"
          test "$(git diff --numstat -- ntoskrnl/inc/amd64.h | awk '{print $1}')" = "16"
          test "$(git diff --numstat -- ntoskrnl/inc/amd64.h | awk '{print $2}')" = "16"
          test "$(git diff -- ntoskrnl/inc/amd64.h | grep -c '^[-+]    M128[A]* Xmm')" = "32"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ntoskrnl/inc/amd64.h
          git commit -m 'Fix AMD64 M128 compatibility'
          git push
