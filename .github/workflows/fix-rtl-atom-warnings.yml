name: Fix RTL atom warnings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix RTL atom warnings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove genuinely unused atom locals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ntoskrnl/rtl/atom.c')
          s = p.read_text()

          empty = re.compile(
              r'(NTSTATUS\s+RtlEmptyAtomTable\s*\([^)]*\)\s*\{.*?\n'
              r'\s*PRTL_ATOM_TABLE_ENTRY )a, aNext, \*pa, \*pa1;',
              re.S,
          )
          pin = re.compile(
              r'(NTSTATUS\s+RtlPinAtomInAtomTable\s*\([^)]*\)\s*\{.*?\n'
              r'\s*PRTL_ATOM_TABLE_ENTRY )a, \*pa;',
              re.S,
          )
          s2, n1 = empty.subn(r'\1a, *pa, *pa1;', s, count=1)
          s2, n2 = pin.subn(r'\1a;', s2, count=1)
          if n1 != 1:
              raise SystemExit(f'Expected exactly one RtlEmptyAtomTable declaration, found {n1}')
          if n2 != 1:
              raise SystemExit(f'Expected exactly one RtlPinAtomInAtomTable declaration, found {n2}')
          p.write_text(s2)
          PY
      - name: Verify exact diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "ntoskrnl/rtl/atom.c"
          test "$(git diff --numstat -- ntoskrnl/rtl/atom.c | awk '{print $1}')" = "2"
          test "$(git diff --numstat -- ntoskrnl/rtl/atom.c | awk '{print $2}')" = "2"
          grep -A8 -F 'RtlEmptyAtomTable(' ntoskrnl/rtl/atom.c | grep -F 'PRTL_ATOM_TABLE_ENTRY a, *pa, *pa1;'
          grep -A8 -F 'RtlPinAtomInAtomTable(' ntoskrnl/rtl/atom.c | grep -F 'PRTL_ATOM_TABLE_ENTRY a;'
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ntoskrnl/rtl/atom.c
          git commit -m 'Fix RTL atom warnings'
          git push
