name: Fix Security test source cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Exclude Security test sources from kernel build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch Security module source filtering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cmake/modules/WRKModuleBuilder.cmake')
          s = p.read_text()
          old = '''            # dumpuser.c is an old LAN Manager/OS2 user-mode account database
            # utility. It depends on os2.h and DOS/Net APIs and must not be
            # compiled into the kernel Security library.
            if(MODULE_NAME STREQUAL "se" AND
               SOURCE_FILE_NORMALIZED MATCHES "(^|/)dumpuser\\\\.c$")
                continue()
            endif()
'''
          new = old + '''            # tse*.c, tt*.c, and ut*.c are WRK Security test programs/common
            # test routines. They contain test-only entry points and headers
            # and must not be compiled into the kernel Security library.
            if(MODULE_NAME STREQUAL "se" AND
               SOURCE_FILE_NORMALIZED MATCHES "(^|/)(tse[^/]*|tt[^/]*|utse[^/]*|utt[^/]*)\\\\.c$")
                continue()
            endif()
'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one Security dumpuser block, found {s.count(old)}')
          p.write_text(s.replace(old, new))

          q = Path('ntoskrnl/se/tsecomm.c')
          t = q.read_bytes()
          if not t.endswith(b'\\x1a'):
              raise SystemExit('Expected trailing U+001A in tsecomm.c was not found')
          q.write_bytes(t[:-1])
          PY
      - name: Verify exact changes
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'cmake/modules/WRKModuleBuilder.cmake\\nntoskrnl/se/tsecomm.c'
          git diff -- cmake/modules/WRKModuleBuilder.cmake ntoskrnl/se/tsecomm.c
          python3 - <<'PY'
          from pathlib import Path
          s = Path('cmake/modules/WRKModuleBuilder.cmake').read_text()
          assert 'tse[^/]*|tt[^/]*|utse[^/]*|utt[^/]*' in s
          assert b'\\x1a' not in Path('ntoskrnl/se/tsecomm.c').read_bytes()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmake/modules/WRKModuleBuilder.cmake ntoskrnl/se/tsecomm.c
          git commit -m 'Exclude Security test sources from kernel build'
          git push
