name: fix-se-build
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Security sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ntoskrnl/se/accessck.c')
          s = p.read_text()
          s = s.replace('    ULONG i,j;\n    PVOID Ace;\n    ULONG AceCount;\n    ULONG Index;\n    ULONG ResultListIndex;\n', '    ULONG j;\n')
          s = s.replace('    PVOID Ace;\n    ULONG AceCount;\n\n    ULONG i;\n    ULONG j;\n    ULONG Index;\n', '')
          p.write_text(s)
          p = Path('sdk/sdk/inc/msaudite.h')
          s = p.read_text()
          marker = '#define SE_ADT_MAX_AUDIT_ID      0x5ff\n'
          if 'SE_AUDITID_AUDITS_DISCARDED' not in s:
              s = s.replace(marker, marker + '\n#define SE_AUDITID_AUDITS_DISCARDED      ((ULONG)0x00000204L)\n')
          p.write_text(s)
          p = Path('ntoskrnl/se/adtlog.c')
          s = p.read_text()
          if 'SE_AUDITID_AUDITS_DISCARDED' not in s:
              s = s.replace('#include <msaudite.h>\n', '#include <msaudite.h>\n\n#ifndef SE_AUDITID_AUDITS_DISCARDED\n#define SE_AUDITID_AUDITS_DISCARDED ((ULONG)0x00000204L)\n#endif\n')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ntoskrnl/se/accessck.c ntoskrnl/se/adtlog.c sdk/sdk/inc/msaudite.h
          git commit -m 'Fix Security module build blockers' || exit 0
          git push
      - name: Remove workflow
        run: |
          rm .github/workflows/fix-se-warnings.yml
          git add .github/workflows/fix-se-warnings.yml
          git commit -m 'Remove one-shot Security build fixer'
          git push