name: migrate debugsup to OpenXP MM locks

on:
  push:
    paths:
      - '.github/workflows/migrate-debgsup-openxp.yml'
      - 'migration-trigger.txt'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adapt debugsup to native OpenXP working-set locks
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="")

          debugsup = "ntoskrnl/mm/debugsup.c"
          text = read(debugsup)

          owner_old = "if (KeGetOwnerGuardedMutex (&Ws->WorkingSetMutex) == KeGetCurrentThread ()) {"
          owner_new = (
              "if ((Ws == &MmSystemCacheWs &&\n"
              "     ((Thread->OwnsSystemWorkingSetExclusive != 0) ||\n"
              "      (Thread->OwnsSystemWorkingSetShared != 0))) ||\n"
              "    ((Ws)->Flags.SessionSpace == 1 &&\n"
              "     ((Thread->OwnsSessionWorkingSetExclusive != 0) ||\n"
              "      (Thread->OwnsSessionWorkingSetShared != 0))) ||\n"
              "    ((Ws)->Flags.SessionSpace == 0 &&\n"
              "     ((Thread->OwnsProcessWorkingSetExclusive != 0) ||\n"
              "      (Thread->OwnsProcessWorkingSetShared != 0)))) {"
          )
          owner_old_count = text.count(owner_old)
          owner_new_count = text.count(owner_new)
          if owner_old_count == 1:
              text = text.replace(owner_old, owner_new, 1)
          elif owner_new_count != 1:
              raise SystemExit("expected one legacy or already-migrated working-set owner check")

          lock_old = re.compile(r"(?m)^[ \t]*LOCK_WORKING_SET \(Ws\);[ \t]*$")
          lock_new = "LOCK_WORKING_SET (Thread, Ws);"
          legacy_locks = lock_old.findall(text)
          native_locks = re.findall(r"(?m)^[ \t]*LOCK_WORKING_SET \(Thread, Ws\);[ \t]*$", text)
          if len(legacy_locks) == 1:
              text = lock_old.sub(lock_new, text, count=1)
          elif len(native_locks) != 1:
              raise SystemExit("expected exactly one legacy or already-migrated LOCK_WORKING_SET call")

          unlock_old = re.compile(r"(?m)^[ \t]*UNLOCK_WORKING_SET \(Ws\);[ \t]*$")
          unlock_new = "UNLOCK_WORKING_SET (Thread, Ws);"
          legacy_unlocks = unlock_old.findall(text)
          native_unlocks = re.findall(r"(?m)^[ \t]*UNLOCK_WORKING_SET \(Thread, Ws\);[ \t]*$", text)
          if len(legacy_unlocks) > 0:
              text = unlock_old.sub(unlock_new, text)
          elif len(native_unlocks) != 4:
              raise SystemExit("expected exactly four legacy or already-migrated UNLOCK_WORKING_SET calls")
          write(debugsup, text)

          compat_path = "ntoskrnl/inc/wrk_msvc_compat.h"
          ctext = read(compat_path)
          block_start = ctext.find("/* debugsup.c is WRK v1.2 source:")
          if block_start >= 0:
              block_end = ctext.find("#endif\n\n#endif /* _WRK_MSVC_COMPAT_H_ */", block_start)
              if block_end < 0:
                  raise SystemExit("debugsup compatibility block terminator was not found")
              ctext = ctext[:block_start] + ctext[block_end + len("#endif\n"):]

          ownership_aliases = re.compile(
              r"#ifndef OwnsSystemWorkingSetExclusive\n#define OwnsSystemWorkingSetExclusive MemoryMaker\n#endif\n"
              r"#ifndef OwnsSystemWorkingSetShared\n#define OwnsSystemWorkingSetShared KeyedEventInUse\n#endif\n"
              r"#ifndef OwnsSessionWorkingSetExclusive\n#define OwnsSessionWorkingSetExclusive ActiveExWorker\n#endif\n"
              r"#ifndef OwnsSessionWorkingSetShared\n#define OwnsSessionWorkingSetShared ExWorkerCanWaitUser\n#endif\n"
              r"#ifndef OwnsProcessWorkingSetExclusive\n#define OwnsProcessWorkingSetExclusive MemoryMaker\n#endif\n"
              r"#ifndef OwnsProcessWorkingSetShared\n#define OwnsProcessWorkingSetShared KeyedEventInUse\n#endif\n"
          )
          ctext, removed = ownership_aliases.subn("", ctext, count=1)
          if removed == 0 and "OwnsSystemWorkingSetExclusive MemoryMaker" in ctext:
              raise SystemExit("working-set ownership compatibility aliases were not removed")
          write(compat_path, ctext)

          builder_path = "cmake/modules/WRKModuleBuilder.cmake"
          btext = read(builder_path)
          pattern = re.compile(
              r"\n\s*if\(MODULE_NAME STREQUAL \"mm\"\)\n"
              r"\s*set_source_files_properties\(\n"
              r"\s*\$\{CMAKE_SOURCE_DIR\}/ntoskrnl/mm/debugsup\.c\n"
              r"\s*PROPERTIES COMPILE_OPTIONS \"/FI\$\{CMAKE_SOURCE_DIR\}/ntoskrnl/inc/wrk_debugsup_msvc_compat\.h\"\)\n"
              r"\s*endif\(\)\n"
          )
          btext, removed = pattern.subn("\n", btext, count=1)
          if removed == 0 and "wrk_debugsup_msvc_compat.h" in btext:
              raise SystemExit("debugsup CMake force-include block was not removed")
          write(builder_path, btext)

          compat_header = Path("ntoskrnl/inc/wrk_debugsup_msvc_compat.h")
          if compat_header.exists():
              compat_header.unlink()

      - name: Verify source migration
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*LOCK_WORKING_SET \(Ws\);[[:space:]]*$' ntoskrnl/mm/debugsup.c
          ! grep -nE '^[[:space:]]*UNLOCK_WORKING_SET \(Ws\);[[:space:]]*$' ntoskrnl/mm/debugsup.c
          ! grep -nF 'KeGetOwnerGuardedMutex (&Ws->WorkingSetMutex)' ntoskrnl/mm/debugsup.c
          test "$(grep -cE '^[[:space:]]*LOCK_WORKING_SET \(Thread, Ws\);[[:space:]]*$' ntoskrnl/mm/debugsup.c)" -eq 1
          test "$(grep -cE '^[[:space:]]*UNLOCK_WORKING_SET \(Thread, Ws\);[[:space:]]*$' ntoskrnl/mm/debugsup.c)" -eq 4
          grep -nF 'OwnsSystemWorkingSetExclusive' ntoskrnl/mm/debugsup.c
          test ! -e ntoskrnl/inc/wrk_debugsup_msvc_compat.h
          ! grep -nF 'wrk_debugsup_msvc_compat.h' cmake/modules/WRKModuleBuilder.cmake
          ! grep -nF '#define OwnsSystemWorkingSetExclusive MemoryMaker' ntoskrnl/inc/wrk_msvc_compat.h

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenXP automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/migrate-debgsup-openxp.yml
          git rm -f migration-trigger.txt 2>/dev/null || true
          git add -A
          git commit -m "mm: adapt debugsup to native OpenXP working-set locks"
          git push
