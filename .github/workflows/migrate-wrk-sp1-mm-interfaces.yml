name: migrate WRK SP1 MM interfaces

on:
  push:
    paths:
      - '.github/workflows/migrate-wrk-sp1-mm-interfaces.yml'
      - '.github/migrate-wrk-sp1-mm-interfaces.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore WRK SP1 MM interfaces
        shell: bash
        run: python3 .github/migrate-wrk-sp1-mm-interfaces.py

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenXP automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ntoskrnl
          git commit -m 'mm: restore WRK v1.2 SP1 MM interfaces'
          git rm -f .github/workflows/migrate-wrk-sp1-mm-interfaces.yml .github/migrate-wrk-sp1-mm-interfaces.py
          git commit -m 'ci: remove completed SP1 MM migration'
          git push
