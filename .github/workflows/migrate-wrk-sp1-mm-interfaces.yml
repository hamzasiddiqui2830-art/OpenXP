name: migrate WRK SP1 MM interfaces

"on":
  push:
    paths:
      - '.github/workflows/migrate-wrk-sp1-mm-interfaces.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore WRK SP1 MM interfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="")

          # WRK v1.2 spelling and interface.  The current OpenXP tree has
          # the same WRK primitive under the non-WRK spelling NONPAGEABLE.
          # Restore the WRK v1.2 name everywhere in active source.
          for root in (Path("ntoskrnl"),):
              for path in root.rglob("*.c"):
                  text = read(path)
                  new = text.replace("MI_NONPAGEABLE_MEMORY_AVAILABLE", "MI_NONPAGABLE_MEMORY_AVAILABLE")
                  if new != text:
                      write(path, new)
              for path in root.rglob("*.h"):
                  text = read(path)
                  new = text.replace("MI_NONPAGEABLE_MEMORY_AVAILABLE", "MI_NONPAGABLE_MEMORY_AVAILABLE")
                  if new != text:
                      write(path, new)

          mi = Path("ntoskrnl/mm/mi.h")
          text = read(mi)
          old = "#define MI_NONPAGABLE_MEMORY_AVAILABLE()"
          if old not in text:
              marker = "#define MI_NONPAGEABLE_MEMORY_AVAILABLE()"
              if marker in text:
                  raise SystemExit("NONPAGEABLE spelling remained in mi.h after global migration")
              raise SystemExit("WRK MI_NONPAGABLE_MEMORY_AVAILABLE definition not found")

          # WRK v1.2 exposes this primitive in mi.h.  The body already exists
          # in OpenXP; this migration restores its WRK spelling rather than
          # adding a compatibility alias.

          # Restore the WRK v1.2 public MM flush flag interface.
          mmh = Path("ntoskrnl/inc/mm.h")
          text = read(mmh)
          flush_block = r'''
//
// Flags for MmFlushSection and related internal flush operations.
// These are the WRK v1.2/SP1 values.
//
#ifndef MM_FLUSH_ACQUIRE_FILE
#define MM_FLUSH_ACQUIRE_FILE       0x1     // Flush must acquire the file.
#endif
#ifndef MM_FLUSH_FAIL_COLLISIONS
#define MM_FLUSH_FAIL_COLLISIONS    0x2     // Fail if write in progress is
                                            // already ongoing for any page.
#endif
#ifndef MM_FLUSH_IN_PARALLEL
#define MM_FLUSH_IN_PARALLEL        0x4     // Don't serialize the flush.
#endif
#ifndef MM_FLUSH_ASYNCHRONOUS
#define MM_FLUSH_ASYNCHRONOUS       0x8     // Issue overlapped I/Os.
#endif
#ifndef MM_FLUSH_SEG_DEREF
#define MM_FLUSH_SEG_DEREF          0x80000000 // Top level segment dereference
                                              // thread issue - Mm internal only.
#endif
'''
          if "#define MM_FLUSH_ACQUIRE_FILE" not in text:
              pos = text.rfind("#endif")
              if pos < 0:
                  raise SystemExit("could not locate mm.h closing #endif")
              text = text[:pos] + flush_block + "\n" + text[pos:]
              write(mmh, text)

          # WRK v1.2 x86 PTE/prototype-PTE primitives used by forksup.c.
          i386 = Path("ntoskrnl/mm/i386/mi386.h")
          text = read(i386)
          i386_block = r'''

//
// WRK v1.2 prototype-PTE address encoding.
//
#define MiProtoAddressForPte(proto_va)  \
   ((((((ULONG)proto_va - MmProtopte_Base) >> 1) & (ULONG)0x000000FE)   | \
    (((((ULONG)proto_va - MmProtopte_Base) << 2) & (ULONG)0xfffff800))) | \
    MM_PTE_PROTOTYPE_MASK)

#define MiProtoAddressForKernelPte(proto_va)  MiProtoAddressForPte(proto_va)

//
// Convert a valid PTE to a write-copy PTE.
//
#if defined(NT_UP)
#define MI_MAKE_VALID_PTE_WRITE_COPY(PPTE) \
                    if ((PPTE)->u.Hard.Write == 1) {    \
                        (PPTE)->u.Hard.CopyOnWrite = 1; \
                        (PPTE)->u.Hard.Write = 0;       \
                    }
#else
#define MI_MAKE_VALID_PTE_WRITE_COPY(PPTE) \
                    if ((PPTE)->u.Hard.Write == 1) {    \
                        (PPTE)->u.Hard.CopyOnWrite = 1; \
                        (PPTE)->u.Hard.Write = 0;       \
                    }
#endif

//
// Convert a software PTE protection to write-copy protection.
//
#define MI_MAKE_PROTECT_WRITE_COPY(PTE) \
        if ((PTE).u.Soft.Protection & MM_PROTECTION_WRITE_MASK) {      \
            (PTE).u.Long |= MM_PROTECTION_COPY_MASK << MM_PROTECT_FIELD_SHIFT;      \
        }

//
// Convert a transition PTE to a valid PTE.
//
#define MI_MAKE_TRANSITION_PTE_VALID(OUTPTE,PPTE)                             \
        ASSERT (((PPTE)->u.Hard.Valid == 0) &&                                \
                ((PPTE)->u.Trans.Prototype == 0) &&                           \
                ((PPTE)->u.Trans.Transition == 1));                           \
               (OUTPTE).u.Long = (((PPTE)->u.Long & ~0xFFF) |                 \
                         (MmProtectToPteMask[(PPTE)->u.Trans.Protection]) |   \
                          MiDetermineUserGlobalPteMask ((PMMPTE)PPTE));
'''
          if "#define MiProtoAddressForPte(proto_va)" not in text:
              pos = text.rfind("#endif")
              if pos < 0:
                  raise SystemExit("could not locate mi386.h closing #endif")
              text = text[:pos] + i386_block + "\n" + text[pos:]
              write(i386, text)

          # WRK v1.2 uses the same PTE write-copy/transition semantics on AMD64.
          amd64 = Path("ntoskrnl/mm/amd64/miamd.h")
          text = read(amd64)
          amd64_block = r'''

//
// WRK v1.2 prototype-PTE address encoding.
//
#define MiProtoAddressForPte(proto_va)  \
    (((ULONG_PTR)proto_va << 16) | MM_PTE_PROTOTYPE_MASK)

#define MiProtoAddressForKernelPte(proto_va)  MiProtoAddressForPte(proto_va)

//
// Convert a valid PTE to a write-copy PTE.
//
#if defined(NT_UP)
#define MI_MAKE_VALID_PTE_WRITE_COPY(PPTE) \
                    if ((PPTE)->u.Hard.Write == 1) {    \
                        (PPTE)->u.Hard.CopyOnWrite = 1; \
                        (PPTE)->u.Hard.Write = 0;       \
                    }
#else
#define MI_MAKE_VALID_PTE_WRITE_COPY(PPTE) \
                    if ((PPTE)->u.Hard.Write == 1) {    \
                        (PPTE)->u.Hard.CopyOnWrite = 1; \
                        (PPTE)->u.Hard.Write = 0;       \
                    }
#endif

//
// Convert a software PTE protection to write-copy protection.
//
#define MI_MAKE_PROTECT_WRITE_COPY(PTE) \
        if ((PTE).u.Soft.Protection & MM_PROTECTION_WRITE_MASK) {      \
            (PTE).u.Long |= MM_PROTECTION_COPY_MASK << MM_PROTECT_FIELD_SHIFT;      \
        }

//
// Convert a transition PTE to a valid PTE.
//
#define MI_MAKE_TRANSITION_PTE_VALID(OUTPTE,PPTE)                             \
        ASSERT (((PPTE)->u.Hard.Valid == 0) &&                                \
                ((PPTE)->u.Trans.Prototype == 0) &&                           \
                ((PPTE)->u.Trans.Transition == 1));                           \
               (OUTPTE).u.Long = (((PPTE)->u.Long & ~0xFFF) |                 \
                         (MmProtectToPteMask[(PPTE)->u.Trans.Protection]) |   \
                          MiDetermineUserGlobalPteMask ((PMMPTE)PPTE));
'''
          if "#define MiProtoAddressForPte(proto_va)" not in text:
              pos = text.rfind("#endif")
              if pos < 0:
                  raise SystemExit("could not locate miamd.h closing #endif")
              text = text[:pos] + amd64_block + "\n" + text[pos:]
              write(amd64, text)

          # WRK v1.2 MiFlushPteList has one argument.  Remove the remaining
          # older call-site argument rather than changing the interface.
          dynmem = Path("ntoskrnl/mm/dynmem.c")
          text = read(dynmem)
          old_call = "MiFlushPteList (&PteFlushList, FALSE);"
          new_call = "MiFlushPteList (&PteFlushList);"
          if old_call in text:
              text = text.replace(old_call, new_call)
              write(dynmem, text)

          # Verify no active source still carries the old MM flush call form.
          for path in Path("ntoskrnl/mm").rglob("*.c"):
              if "MiFlushPteList (&" in read(path) and ", FALSE)" in read(path):
                  raise SystemExit(f"old two-argument MiFlushPteList call remains: {path}")

          # Verify the WRK interface names exist exactly once where expected.
          checks = {
              "ntoskrnl/mm/mi.h": ["#define MI_NONPAGABLE_MEMORY_AVAILABLE()"],
              "ntoskrnl/inc/mm.h": ["#define MM_FLUSH_ACQUIRE_FILE", "#define MM_FLUSH_FAIL_COLLISIONS", "#define MM_FLUSH_IN_PARALLEL", "#define MM_FLUSH_ASYNCHRONOUS", "#define MM_FLUSH_SEG_DEREF"],
              "ntoskrnl/mm/i386/mi386.h": ["#define MiProtoAddressForPte(proto_va)", "#define MI_MAKE_VALID_PTE_WRITE_COPY", "#define MI_MAKE_PROTECT_WRITE_COPY", "#define MI_MAKE_TRANSITION_PTE_VALID"],
              "ntoskrnl/mm/amd64/miamd.h": ["#define MiProtoAddressForPte(proto_va)", "#define MI_MAKE_VALID_PTE_WRITE_COPY", "#define MI_MAKE_PROTECT_WRITE_COPY", "#define MI_MAKE_TRANSITION_PTE_VALID"],
          }
          for name, needles in checks.items():
              text = read(name)
              for needle in needles:
                  if text.count(needle) != 1:
                      raise SystemExit(f"unexpected count for {needle!r} in {name}: {text.count(needle)}")

          # No active source should retain the non-WRK spelling.
          for root in (Path("ntoskrnl"),):
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix in {".c", ".h"}:
                      if "MI_NONPAGEABLE_MEMORY_AVAILABLE" in read(path):
                          raise SystemExit(f"old NONPAGEABLE spelling remains: {path}")
          PY

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenXP automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ntoskrnl/mm/mi.h ntoskrnl/inc/mm.h ntoskrnl/mm/i386/mi386.h ntoskrnl/mm/amd64/miamd.h ntoskrnl/mm/dynmem.c ntoskrnl/mm
          git diff --cached --check
          git commit -m "mm: restore WRK v1.2 SP1 MM interfaces"
          git rm -f .github/workflows/migrate-wrk-sp1-mm-interfaces.yml
          git commit -m "ci: remove completed SP1 MM migration"
          git push