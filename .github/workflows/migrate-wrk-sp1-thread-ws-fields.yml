name: restore WRK SP1 working-set thread fields

"on":
  push:
    paths:
      - '.github/workflows/migrate-wrk-sp1-thread-ws-fields.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore WRK SP1 ETHREAD working-set ownership flags
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ntoskrnl/inc/ps.h")
          text = path.read_text(encoding="utf-8")

          marker = "            BOOLEAN AddressSpaceOwner     : 1;\n        };\n"
          replacement = """            BOOLEAN AddressSpaceOwner     : 1;
            BOOLEAN OwnsProcessWorkingSetExclusive : 1;
            BOOLEAN OwnsProcessWorkingSetShared : 1;
            BOOLEAN OwnsSystemWorkingSetExclusive : 1;
            BOOLEAN OwnsSystemWorkingSetShared : 1;
            BOOLEAN OwnsSessionWorkingSetExclusive : 1;
            BOOLEAN OwnsSessionWorkingSetShared : 1;
        };
          """

          if text.count(marker) == 1 and "OwnsProcessWorkingSetExclusive" not in text:
              text = text.replace(marker, replacement, 1)
          elif text.count("OwnsProcessWorkingSetExclusive") != 1:
              raise SystemExit("unexpected ETHREAD working-set ownership field state")

          path.write_text(text, encoding="utf-8", newline="")
          PY

      - name: Verify fields
        shell: bash
        run: |
          set -euo pipefail
          for field in \
            OwnsProcessWorkingSetExclusive \
            OwnsProcessWorkingSetShared \
            OwnsSystemWorkingSetExclusive \
            OwnsSystemWorkingSetShared \
            OwnsSessionWorkingSetExclusive \
            OwnsSessionWorkingSetShared; do
            test "$(grep -cF "$field" ntoskrnl/inc/ps.h)" -eq 1
          done

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenXP automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ntoskrnl/inc/ps.h
          git commit -m "mm: restore WRK SP1 working-set ownership fields"
          git rm -f .github/workflows/migrate-wrk-sp1-thread-ws-fields.yml
          git commit -m "ci: remove completed SP1 thread field migration"
          git push
