name: Apply OB header fix

on:
  push:
    branches: [fix/ob-header-compat]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ob.h
        shell: python
        run: |
          from pathlib import Path
          p = Path('ntoskrnl/inc/ob.h')
          s = p.read_text()

          old = '''typedef struct _OBJECT_DIRECTORY_ENTRY {\n    struct _OBJECT_DIRECTORY_ENTRY *ChainLink;\n    PVOID Object;\n} OBJECT_DIRECTORY_ENTRY, *POBJECT_DIRECTORY_ENTRY;'''
          new = '''typedef struct _OBJECT_DIRECTORY_ENTRY {\n    struct _OBJECT_DIRECTORY_ENTRY *ChainLink;\n    PVOID Object;\n    ULONG HashValue;\n} OBJECT_DIRECTORY_ENTRY, *POBJECT_DIRECTORY_ENTRY;'''
          assert old in s, 'OBJECT_DIRECTORY_ENTRY block not found'
          s = s.replace(old, new, 1)

          old = '''typedef struct _OBJECT_HEADER_CREATOR_INFO {\n    LIST_ENTRY TypeList;\n    HANDLE CreatorUniqueProcess;\n    USHORT CreatorBackTraceIndex;\n    USHORT Reserved;\n} OBJECT_HEADER_CREATOR_INFO, *POBJECT_HEADER_CREATOR_INFO;'''
          new = '''typedef struct _OBJECT_HEADER_CREATOR_INFO {\n    LIST_ENTRY TypeList;\n    HANDLE CreatorUniqueProcess;\n    USHORT CreatorBackTraceIndex;\n    USHORT Reserved;\n} OBJECT_HEADER_CREATOR_INFO, *POBJECT_HEADER_CREATOR_INFO;\n\n//\n// Object header optional-information accessors used by the WRK Object\n// Manager sources.  The *_EXISTS forms assert that the corresponding\n// optional header is present; the offset is stored in the object header.\n//\nFORCEINLINE\nPOBJECT_HEADER_QUOTA_INFO\nOBJECT_HEADER_TO_QUOTA_INFO_EXISTS (\n    IN POBJECT_HEADER ObjectHeader\n    )\n{\n    ASSERT(ObjectHeader->QuotaInfoOffset != 0);\n    return (POBJECT_HEADER_QUOTA_INFO)((PUCHAR)ObjectHeader -\n                                       ObjectHeader->QuotaInfoOffset);\n}\n\nFORCEINLINE\nPOBJECT_HEADER_HANDLE_INFO\nOBJECT_HEADER_TO_HANDLE_INFO_EXISTS (\n    IN POBJECT_HEADER ObjectHeader\n    )\n{\n    ASSERT(ObjectHeader->HandleInfoOffset != 0);\n    return (POBJECT_HEADER_HANDLE_INFO)((PUCHAR)ObjectHeader -\n                                        ObjectHeader->HandleInfoOffset);\n}\n\nFORCEINLINE\nPOBJECT_HEADER_NAME_INFO\nOBJECT_HEADER_TO_NAME_INFO_EXISTS (\n    IN POBJECT_HEADER ObjectHeader\n    )\n{\n    ASSERT(ObjectHeader->NameInfoOffset != 0);\n    return (POBJECT_HEADER_NAME_INFO)((PUCHAR)ObjectHeader -\n                                      ObjectHeader->NameInfoOffset);\n}'''
          assert old in s, 'creator-info block not found'
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ntoskrnl/inc/ob.h
          git commit -m 'Match Object Manager header layout to sources'
          git push

      - name: Remove patch workflow
        if: always()
        run: |
          git rm -f .github/workflows/patch-ob-header.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-shot OB header patch workflow' || true
          git push || true
