name: reconcile-sp1
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Apply SP1 structural reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SP1 structural definitions
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count == 0:
                  if new in s:
                      return
                  raise SystemExit(f'{path}: exact source text not found')
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} exact match(es), found {count}')
              p.write_text(s.replace(old, new, expected))

          replace('ntoskrnl/inc/ps.h',
                  '    KGUARDED_MUTEX WorkingSetMutex;\n',
                  '    EX_PUSH_LOCK WorkingSetMutex;\n')

          replace('ntoskrnl/inc/ps.h',
                  '    BOOLEAN ForwardClusterOnly;\n    BOOLEAN DisablePageFaultClustering;\n',
                  '    BOOLEAN ForwardClusterOnly;\n    BOOLEAN DisablePageFaultClustering;\n    UCHAR ActiveFaultCount;\n')

          replace('ntoskrnl/mm/i386/mi386.h',
                  'typedef struct _MMPTE_TRANSITION { ULONG Valid : 1; ULONG Prototype : 1; ULONG Protection : 5; ULONG Transition : 1; ULONG Reserved0 : 3; ULONG PageFrameNumber : 20 - PAGE_SHIFT; ULONG Reserved : 11; } MMPTE_TRANSITION;',
                  'typedef struct _MMPTE_TRANSITION { ULONG Valid : 1; ULONG Write : 1; ULONG Owner : 1; ULONG WriteThrough : 1; ULONG CacheDisable : 1; ULONG Protection : 5; ULONG Prototype : 1; ULONG Transition : 1; ULONG PageFrameNumber : 20; } MMPTE_TRANSITION;')

          replace('ntoskrnl/inc/i386.h',
                  '    ULONG   SpareFields0[4];\n',
                  '''    LONG MmPageFaultCount;\n    LONG MmCopyOnWriteCount;\n    LONG MmTransitionCount;\n    LONG MmCacheTransitionCount;\n    LONG MmDemandZeroCount;\n    LONG MmPageReadCount;\n    LONG MmPageReadIoCount;\n    LONG MmCacheReadCount;\n    LONG MmCacheIoCount;\n    LONG MmDirtyPagesWriteCount;\n    LONG MmDirtyWriteIoCount;\n    LONG MmMappedPagesWriteCount;\n    LONG MmMappedWriteIoCount;\n    ULONG SpareFields0[1];\n''')

          replace('ntoskrnl/inc/i386.h',
                  '    volatile ULONGLONG IsrTime;\n',
                  '    volatile ULONGLONG IsrTime;\n    ULONGLONG SpareField1;\n')

          # WRK v1.2 / SP1 uses the zero-argument KeFlushProcessTb form.
          # Do not carry the SP0 AllProcessors parameter into the SP1 MM layer.
          replace('ntoskrnl/mm/mi.h',
                  '        KeFlushProcessTb (AllProcessors);\n',
                  '        KeFlushProcessTb ();\n')

          ke = Path('ntoskrnl/inc/ke.h')
          s = ke.read_text()
          old = 'KeFlushProcessTb (\n    IN BOOLEAN AllProcessors\n    )'
          new = 'KeFlushProcessTb (\n    VOID\n    )'
          count = s.count(old)
          if count:
              if count != 2:
                  raise SystemExit(f'ntoskrnl/inc/ke.h: expected two SP0 KeFlushProcessTb signatures, found {count}')
              s = s.replace(old, new, 2)
              ke.write_text(s)
          elif s.count(new) != 2:
              raise SystemExit('ntoskrnl/inc/ke.h: SP1 zero-argument KeFlushProcessTb form not present')

          # Remove the temporary compatibility shim; SP1 now has the native
          # zero-argument declaration and callers should bind to it directly.
          compat = Path('ntoskrnl/inc/wrk_msvc_compat.h')
          s = compat.read_text()
          old = '''#ifndef WRK_KE_FLUSH_PROCESS_TB_ZERO_ARG_COMPAT\n#define WRK_KE_FLUSH_PROCESS_TB_ZERO_ARG_COMPAT\n#define KeFlushProcessTb() KeFlushProcessTb(FALSE)\n#endif\n'''
          if old in s:
              compat.write_text(s.replace(old, '', 1))

          p = Path('ntos-old/ex/pool.c')
          s = p.read_text()
          old = '#define InterlockedExchangeAddSizeT(a,b) InterlockedExchangeAdd((PLONG)(a),(LONG)(b))\n'
          if old in s:
              p.write_text(s.replace(old, '', 1))

      - name: Commit patch
        run: |
          git config user.name 'OpenXP CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ntoskrnl/inc/ps.h ntoskrnl/mm/i386/mi386.h ntoskrnl/inc/i386.h ntoskrnl/inc/ke.h ntoskrnl/mm/mi.h ntos-old/ex/pool.c ntoskrnl/inc/wrk_msvc_compat.h
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply SP1 structural reconciliation'
          git push
