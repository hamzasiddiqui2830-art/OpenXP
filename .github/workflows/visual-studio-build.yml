name: CMake Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-vs-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC x86 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Configure CMake (x86)
      run: |
        cmake -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DWRK_ARCH=i386 `
          -DBUILD_NTOSKRNL_TESTS=OFF `
          -B "${{ github.workspace }}/output-VS-i386/build" `
          -S "${{ github.workspace }}"
      working-directory: ${{ github.workspace }}

    - name: Build with CMake (x86)
      run: |
        cmake --build "${{ github.workspace }}/output-VS-i386/build" --parallel
      working-directory: ${{ github.workspace }}

    - name: Upload x86 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wrk-build-vs-x86
        path: |
          ${{ github.workspace }}/output-VS-i386/**/*.exe
          ${{ github.workspace }}/output-VS-i386/**/*.dll
          ${{ github.workspace }}/output-VS-i386/**/*.sys
          ${{ github.workspace }}/output-VS-i386/**/*.lib
        if-no-files-found: warn

  build-vs-x64:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC x64 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake (x64)
      run: |
        cmake -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DWRK_ARCH=amd64 `
          -DBUILD_NTOSKRNL_TESTS=OFF `
          -B "${{ github.workspace }}/output-VS-amd64/build" `
          -S "${{ github.workspace }}"
      working-directory: ${{ github.workspace }}

    - name: Build with CMake (x64)
      run: |
        cmake --build "${{ github.workspace }}/output-VS-amd64/build" --parallel
      working-directory: ${{ github.workspace }}

    - name: Upload x64 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wrk-build-vs-x64
        path: |
          ${{ github.workspace }}/output-VS-amd64/**/*.exe
          ${{ github.workspace }}/output-VS-amd64/**/*.dll
          ${{ github.workspace }}/output-VS-amd64/**/*.sys
          ${{ github.workspace }}/output-VS-amd64/**/*.lib
        if-no-files-found: warn
