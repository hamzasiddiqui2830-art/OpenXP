name: OpenXP Visual Studio Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-vs-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout OpenXP
      uses: actions/checkout@v4

    - name: Apply MASM 14.51 compatibility fixes
      shell: pwsh
      run: python tools/apply_masm_1451_fixes.py
      working-directory: ${{ github.workspace }}

    - name: Setup MSVC x86 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Configure OpenXP (x86)
      shell: cmd
      run: configure.cmd vs i386
      working-directory: ${{ github.workspace }}

    - name: Build OpenXP (x86)
      shell: cmd
      run: cmake --build "${{ github.workspace }}\output-vs-i386\build" --config Release --parallel
      working-directory: ${{ github.workspace }}

    - name: Upload OpenXP x86 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openxp-build-vs-x86
        path: |
          ${{ github.workspace }}/output-vs-i386/**/*.exe
          ${{ github.workspace }}/output-vs-i386/**/*.dll
          ${{ github.workspace }}/output-vs-i386/**/*.sys
          ${{ github.workspace }}/output-vs-i386/**/*.lib
        if-no-files-found: warn

  build-vs-x64:
    runs-on: windows-latest

    steps:
    - name: Checkout OpenXP
      uses: actions/checkout@v4

    - name: Apply MASM 14.51 compatibility fixes
      shell: pwsh
      run: python tools/apply_masm_1451_fixes.py
      working-directory: ${{ github.workspace }}

    - name: Setup MSVC x64 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure OpenXP (x64)
      shell: cmd
      run: configure.cmd vs amd64
      working-directory: ${{ github.workspace }}

    - name: Build OpenXP (x64)
      shell: cmd
      run: cmake --build "${{ github.workspace }}\output-vs-amd64\build" --config Release --parallel
      working-directory: ${{ github.workspace }}

    - name: Upload OpenXP x64 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openxp-build-vs-x64
        path: |
          ${{ github.workspace }}/output-vs-amd64/**/*.exe
          ${{ github.workspace }}/output-vs-amd64/**/*.dll
          ${{ github.workspace }}/output-vs-amd64/**/*.sys
          ${{ github.workspace }}/output-vs-amd64/**/*.lib
        if-no-files-found: warn
