    - name: Reconcile SP1 kernel structures
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        function Replace-Exact($Path, $Old, $New) {
          $p = Join-Path $env:GITHUB_WORKSPACE $Path
          $s = [IO.File]::ReadAllText($p)
          if ($s.Contains($New)) { return }
          if (-not $s.Contains($Old)) { throw "$Path: expected SP0 form not found" }
          [IO.File]::WriteAllText($p, $s.Replace($Old, $New))
        }
        function Replace-Regex($Path, $Pattern, $New) {
          $p = Join-Path $env:GITHUB_WORKSPACE $Path
          $s = [IO.File]::ReadAllText($p)
          if ($s.Contains($New)) { return }
          if (-not [regex]::IsMatch($s, $Pattern)) { throw "$Path: expected SP0 form not found" }
          $s = [regex]::Replace($s, $Pattern, $New, [Text.RegularExpressions.RegexOptions]::Multiline)
          [IO.File]::WriteAllText($p, $s)
        }
        Replace-Exact 'ntoskrnl/inc/ps.h' '    KGUARDED_MUTEX WorkingSetMutex;' '    EX_PUSH_LOCK WorkingSetMutex;'
        Replace-Regex 'ntoskrnl/inc/ps.h' '    BOOLEAN ForwardClusterOnly;\r?\n    BOOLEAN DisablePageFaultClustering;' "    BOOLEAN ForwardClusterOnly;`r`n    BOOLEAN DisablePageFaultClustering;`r`n    UCHAR ActiveFaultCount;"
        Replace-Exact 'ntoskrnl/mm/i386/mi386.h' 'typedef struct _MMPTE_TRANSITION { ULONG Valid : 1; ULONG Prototype : 1; ULONG Protection : 5; ULONG Transition : 1; ULONG Reserved0 : 3; ULONG PageFrameNumber : 20 - PAGE_SHIFT; ULONG Reserved : 11; } MMPTE_TRANSITION;' 'typedef struct _MMPTE_TRANSITION { ULONG Valid : 1; ULONG Write : 1; ULONG Owner : 1; ULONG WriteThrough : 1; ULONG CacheDisable : 1; ULONG Protection : 5; ULONG Prototype : 1; ULONG Transition : 1; ULONG PageFrameNumber : 20; } MMPTE_TRANSITION;'
        Replace-Exact 'ntoskrnl/inc/i386.h' '    ULONG   SpareFields0[4];' @'
    LONG MmPageFaultCount;
    LONG MmCopyOnWriteCount;
    LONG MmTransitionCount;
    LONG MmCacheTransitionCount;
    LONG MmDemandZeroCount;
    LONG MmPageReadCount;
    LONG MmPageReadIoCount;
    LONG MmCacheReadCount;
    LONG MmCacheIoCount;
    LONG MmDirtyPagesWriteCount;
    LONG MmDirtyWriteIoCount;
    LONG MmMappedPagesWriteCount;
    LONG MmMappedWriteIoCount;
    ULONG SpareFields0[1];'@
        Replace-Regex 'ntoskrnl/inc/i386.h' '    volatile ULONGLONG IsrTime;\r?\n' "    volatile ULONGLONG IsrTime;`r`n    ULONGLONG SpareField1;`r`n"
        Replace-Exact 'ntoskrnl/mm/mi.h' '        KeFlushProcessTb ();' '        KeFlushProcessTb (AllProcessors);'
        $pool = Join-Path $env:GITHUB_WORKSPACE 'ntos-old/ex/pool.c'
        $s = [IO.File]::ReadAllText($pool)
        $s = [regex]::Replace($s, '(?m)^#define InterlockedExchangeAddSizeT\(a,b\) InterlockedExchangeAdd\(\(PLONG\)\(a\),\(LONG\)\(b\)\)\r?\n?', '')
        [IO.File]::WriteAllText($pool, $s)
        $compat = Join-Path $env:GITHUB_WORKSPACE 'ntoskrnl/inc/wrk_msvc_compat.h'
        $s = [IO.File]::ReadAllText($compat)
        $s = [regex]::Replace($s, '(?ms)^#ifndef KeFlushProcessTb\r?\n#define KeFlushProcessTb\(\) KeFlushProcessTb\(FALSE\)\r?\n#endif\r?\n', '')
        [IO.File]::WriteAllText($compat, $s)
        git diff --check

    - name: Setup MSVC x64 environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure OpenXP (x64)
      shell: cmd
      run: configure.cmd vs amd64
      working-directory: ${{ github.workspace }}

    - name: Build OpenXP (x64)
      shell: cmd
      run: cmake --build "${{ github.workspace }}\output-vs-amd64\build" --config Release --parallel
      working-directory: ${{ github.workspace }}

    - name: Upload OpenXP x64 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openxp-build-vs-x64
        path: |
          ${{ github.workspace }}/output-vs-amd64/**/*.exe
          ${{ github.workspace }}/output-vs-amd64/**/*.dll
          ${{ github.workspace }}/output-vs-amd64/**/*.sys
