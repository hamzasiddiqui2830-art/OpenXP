name: Visual Studio Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-vs-x86:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake for Visual Studio (x86)
      run: |
        cmake -G "Visual Studio 18 2026" -A Win32 `
          -DWRK_ARCH=i386 `
          -DCMAKE_BINARY_DIR="${{ github.workspace }}/output-VS-i386" `
          -B "${{ github.workspace }}/output-VS-i386/build" `
          -S "${{ github.workspace }}"
      working-directory: ${{ github.workspace }}

    - name: Build with CMake (x86)
      run: |
        cmake --build "${{ github.workspace }}/output-VS-i386/build" `
          --config Release `
          -- /maxcpucount
      working-directory: ${{ github.workspace }}

    - name: Upload x86 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wrk-build-vs-x86
        path: |
          ${{ github.workspace }}/output-VS-i386/**/*.exe
          ${{ github.workspace }}/output-VS-i386/**/*.dll
          ${{ github.workspace }}/output-VS-i386/**/*.sys
          ${{ github.workspace }}/output-VS-i386/**/*.lib
        if-no-files-found: warn

  build-vs-x64:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake for Visual Studio (x64)
      run: |
        cmake -G "Visual Studio 18 2026" -A x64 `
          -DWRK_ARCH=amd64 `
          -DCMAKE_BINARY_DIR="${{ github.workspace }}/output-VS-amd64" `
          -B "${{ github.workspace }}/output-VS-amd64/build" `
          -S "${{ github.workspace }}"
      working-directory: ${{ github.workspace }}

    - name: Build with CMake (x64)
      run: |
        cmake --build "${{ github.workspace }}/output-VS-amd64/build" `
          --config Release `
          -- /maxcpucount
      working-directory: ${{ github.workspace }}

    - name: Upload x64 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wrk-build-vs-x64
        path: |
          ${{ github.workspace }}/output-VS-amd64/**/*.exe
          ${{ github.workspace }}/output-VS-amd64/**/*.dll
          ${{ github.workspace }}/output-VS-amd64/**/*.sys
          ${{ github.workspace }}/output-VS-amd64/**/*.lib
        if-no-files-found: warn
